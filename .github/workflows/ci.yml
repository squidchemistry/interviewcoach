name: CI

on:
  push:
    branches: [main, demo-ready]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest on Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coach
          POSTGRES_PASSWORD: coach
          POSTGRES_DB: coach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coach -d coach_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # tests/conftest.py runs every test against this database when set.
      TEST_DATABASE_URL: postgresql+psycopg://coach:coach@localhost:5432/coach_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  frontend:
    name: Frontend (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # CI=true (set by GitHub) makes Jest run once and the build fail on lint warnings.
      - run: npm test -- --watchAll=false
      - run: npm run build

  docker:
    name: Docker images + compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -t interviewcoach-api:ci .
      - name: Build frontend image
        run: docker build -t interviewcoach-web:ci ./frontend
      - name: Start the stack (mock LLM)
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke test
        run: |
          set -eux
          curl -fsS http://localhost:8000/ready
          curl -fsS "http://localhost:8000/v1/sessions?limit=1"
          curl -fsS -X POST http://localhost:8000/v1/sessions \
            -H 'Content-Type: application/json' \
            -d '{"role":"Backend Engineer","experience":"2-5 years","num_questions":2}'
          curl -fsS http://localhost:3000/history | grep -q '<div id="root">'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - name: Install gitleaks (checksum-verified)
        run: |
          set -eu
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      # .gitleaksignore lists the two known, already-public findings (see that file).
      - name: Scan git history
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --verbose --exit-code 1'
