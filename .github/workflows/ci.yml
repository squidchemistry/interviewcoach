name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No TODO/FIXME placeholders in production code
        run: |
          if grep -rnE "\b(TODO|FIXME|XXX)\b" backend/src/main frontend/src --include=*.java --include=*.ts --include=*.tsx --include=*.sql --include=*.yml; then
            echo "::error::Placeholder markers found in production code"; exit 1
          fi
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (Java 25 · unit + integration + ArchUnit + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify (Testcontainers uses the runner's Docker)
        run: ./mvnw -B -ntp verify
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
            backend/target/site/jacoco
          retention-days: 7

  frontend:
    name: Frontend (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images + compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from example
        run: cp .env.example .env
      - name: Build and start the stack
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Smoke test through nginx and directly
        run: |
          curl -fsS http://localhost:8080/api/v1/health | tee /dev/stderr | grep -q '"status":"UP"'
          curl -fsS http://localhost:8088/api/v1/health | grep -q '"status":"UP"'
          curl -fsS http://localhost:8088/ | grep -q '<div id="root">'
      - name: Generated API types are up to date
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::frontend/src/api/schema.d.ts is stale. Run 'npm run gen:api' with the API running and commit it."; exit 1; }
      - name: Auth smoke test (seeded demo user)
        run: |
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"email":"demo@aicoach.dev","password":"DemoPass2026"}' \
            http://localhost:8088/api/v1/auth/login | grep -q '"accessToken"'
      - name: End-to-end (Playwright, AI_PROVIDER=mock)
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8088
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
