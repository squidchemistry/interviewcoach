# One-command local stack:  cp .env.example .env  &&  docker compose up --build
#   web  http://localhost:8088   (nginx: SPA + /api reverse proxy)       — override with WEB_PORT
#   api  http://localhost:8080   (Swagger UI: /swagger-ui.html)           — override with API_PORT
# (5173 is left free for the Vite dev server: `npm run dev` in /frontend.)
# Optional sandboxed code execution (Phase 6):  docker compose --profile judge0 up -d
name: ai-interview-coach

x-judge0-env: &judge0-env
  REDIS_HOST: judge0-redis
  REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:?Set JUDGE0_REDIS_PASSWORD in .env}
  POSTGRES_HOST: judge0-db
  POSTGRES_DB: judge0
  POSTGRES_USER: judge0
  POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD:?Set JUDGE0_DB_PASSWORD in .env}
  AUTHN_HEADER: X-Auth-Token
  AUTHN_TOKEN: ${JUDGE0_AUTH_TOKEN:?Set JUDGE0_AUTH_TOKEN in .env}
  ENABLE_NETWORK: "false"
  ALLOW_ENABLE_NETWORK: "false"
  CPU_TIME_LIMIT: "2"
  MAX_CPU_TIME_LIMIT: "5"
  WALL_TIME_LIMIT: "5"
  MEMORY_LIMIT: "262144"
  MAX_MEMORY_LIMIT: "262144"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aicoach}
      POSTGRES_USER: ${POSTGRES_USER:-aicoach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432" # loopback only: for local tools and `mvnw spring-boot:run`
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aicoach}
      DATABASE_USERNAME: ${POSTGRES_USER:-aicoach}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8088}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:8088}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -base64 48)}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL_FAST: ${AI_MODEL_FAST:-claude-haiku-5-5}
      AI_MODEL_SMART: ${AI_MODEL_SMART:-claude-sonnet-5-5}
      AI_SESSION_TOKEN_BUDGET: ${AI_SESSION_TOKEN_BUDGET:-80000}
      AI_DAILY_TOKEN_BUDGET: ${AI_DAILY_TOKEN_BUDGET:-400000}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-mock}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-}
      CODE_EXECUTOR: ${CODE_EXECUTOR:-mock}
      JUDGE0_URL: ${JUDGE0_URL:-http://judge0-server:2358}
      JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:-}
      JUDGE0_AUTH_HEADER: ${JUDGE0_AUTH_HEADER:-X-Auth-Token}
      JUDGE0_RAPIDAPI_HOST: ${JUDGE0_RAPIDAPI_HOST:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-mock}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_PLAN_ID: ${RAZORPAY_PLAN_ID:-}
      FREE_MONTHLY_INTERVIEWS: ${FREE_MONTHLY_INTERVIEWS:-3}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
    ports:
      - "${API_PORT:-8080}:8080" # 8081 (management) is intentionally not published
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  # ---------------- Judge0 CE sandbox (profile: judge0) ----------------
  judge0-server:
    image: judge0/judge0:1.13.1
    profiles: ["judge0"]
    environment: *judge0-env
    privileged: true # required by isolate (sandbox); never expose this service publicly
    ports:
      - "127.0.0.1:2358:2358"
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy

  judge0-workers:
    image: judge0/judge0:1.13.1
    profiles: ["judge0"]
    command: ["./scripts/workers"]
    environment: *judge0-env
    privileged: true
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy

  judge0-db:
    image: postgres:16-alpine
    profiles: ["judge0"]
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD}
    volumes:
      - judge0-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0 -d judge0"]
      interval: 5s
      timeout: 3s
      retries: 20

  judge0-redis:
    image: redis:7-alpine
    profiles: ["judge0"]
    environment:
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
  judge0-db:
